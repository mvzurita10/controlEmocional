# .github/workflows/deploy.yml
name: ControlEmocional — CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # ── Job 1: Tests ──────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       therappy_test_db
          POSTGRES_USER:     therappy_user
          POSTGRES_PASSWORD: therappy_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          # Variables de entorno sacadas de tu .env
          SECRET_KEY:             6=5*9+4qwf%$5g$*()h^91uvwbel-s*ofsq_@!46g2eskli#tn
          DEBUG:                  True
          ALLOWED_HOSTS:          5.161.71.155,127.0.0.1,zurita-emocional.uaeftt-ute.site
          DB_NAME:                therappy_test_db
          DB_USER:                therappy_user
          DB_PASSWORD:            therappy_pass
          DB_HOST:                localhost
          DB_PORT:                5432
          TEST_DB_NAME:           therappy_test_db
          CORS_ALLOW_ALL_ORIGINS: True
        
        run: uv run python manage.py test --verbosity=2

  # ── Job 2: Deploy ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPSSSHKEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            # ── Definimos la ruta directamente dentro del servidor ──
            PROJECT_DIR="/opt/controlEmocional"

            echo "── 1. Actualizando código ──"
            cd $PROJECT_DIR
            
            # Evita el bloqueo de propiedad dudosa de Git
            git config --global --add safe.directory $PROJECT_DIR
            
            git fetch origin
            git reset --hard origin/master

            echo "── 2. Instalando dependencias ──"
            # Actualiza dependencias usando el pip de tu entorno virtual
            $PROJECT_DIR/.venv/bin/pip install -r requirements.txt

            echo "── 3. Aplicando migraciones ──"
            $PROJECT_DIR/.venv/bin/python3 manage.py migrate --noinput

            echo "── 4. Recolectando estáticos ──"
            $PROJECT_DIR/.venv/bin/python3 manage.py collectstatic --noinput --clear

            echo "── 5. Reiniciando servicios ──"
            # Se reinicia Gunicorn usando el nombre del servicio que configuraste
            sudo systemctl restart gunicorn-therappy
            sudo systemctl restart nginx

            echo "── 6. Verificando salud de la API ──"
            sleep 3
            # Hacemos curl a tu dominio para comprobar que responde
            curl -sf http://zurita-emocional.uaeftt-ute.site/api/health/ && echo "API OK" || echo "API ERROR"

            echo "Despliegue completado exitosamente"
          ENDSSH
